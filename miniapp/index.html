<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ARZON</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <!-- Brend logotipi (task_1). Rasm topilmasa matnga qaytadi. -->
    <img src="assets/logo.png" alt="ARZON" class="logo"
         onerror="this.outerHTML='&lt;h1&gt;ARZON&lt;/h1&gt;'" />
    <div class="header-right">
      <!-- ACOM coin balansi -->
      <span id="balance-chip" class="balance-chip" title="ACOM balansingiz" hidden>
        <img src="assets/acom_coin.png" alt="ACOM" class="coin-ico" />
        <b id="balance-val">0</b>
      </span>
      <button id="btn-code" class="code-btn" title="Mahfiy kod kiritish">🔑 Kod</button>
    </div>
  </header>

  <!-- Bitta umumiy katalog (rule 1) — do'kon tanlash ekrani YO'Q -->
  <main id="view-katalog" class="view active">
    <!-- Banner joyi (task_1) — hozircha statik, bosilganda filtrlaydi -->
    <div id="banners" class="banner-strip"></div>

    <!-- Kategoriya chiplari (task_1) — funksional filtrlar -->
    <div id="cat-chips" class="cat-chips"></div>

    <div class="search-bar">
      <input id="search" type="search" placeholder="🔍 Mahsulot qidirish..." />
      <select id="sort" title="Saralash">
        <option value="">Saralash</option>
        <option value="asc">Narx: arzon → qimmat</option>
        <option value="desc">Narx: qimmat → arzon</option>
      </select>
    </div>
    <div id="catalog" class="catalog"></div>
    <div id="catalog-empty" hidden></div>
  </main>

  <!-- Mahsulot batafsil sahifasi (task_3) -->
  <main id="view-product" class="view">
    <button id="btn-back-detail" class="back-btn">⬅️ Katalogga qaytish</button>
    <div id="product-detail"></div>
  </main>

  <!-- Tezkor xarid — Buy Now oqimi (task_4) -->
  <main id="view-buynow" class="view">
    <button id="btn-back-buynow" class="back-btn">⬅️ Orqaga</button>
    <h2>⚡ Tezkor xarid</h2>
    <div id="buynow-box"></div>
  </main>

  <main id="view-savat" class="view">
    <h2>Savat</h2>
    <div id="cart-items"></div>
    <div id="cart-empty"></div>
    <div id="cart-summary" class="cart-summary" hidden>
      <input id="promo" type="text" placeholder="Promo kod (ixtiyoriy)" />

      <div class="delivery">
        <div class="deliv-label">Yetkazib berish turi:</div>
        <div class="deliv-toggle">
          <button id="deliv-kuryer" class="deliv-btn active" type="button">🚚 Kuryer</button>
          <button id="deliv-pickup" class="deliv-btn" type="button">🏬 Punktdan olish</button>
        </div>
        <input id="manzil" type="text" placeholder="Yetkazish manzili (ko'cha, uy...)" />
        <div id="pickup-container"></div>
        <button id="btn-location" class="loc-btn" type="button">📍 Joylashuvni yuborish</button>
        <div id="loc-status" class="loc-status" hidden></div>
      </div>

      <div class="summary-box">
        <div class="summary-row"><span>Mahsulotlar:</span><span id="cart-subtotal">0 som</span></div>
        <div class="summary-row" id="deliv-fee-row"><span>🚚 Yetkazish:</span><span id="cart-fee">0 som</span></div>
        <div class="summary-row total"><span>Jami:</span><span id="cart-total-box"><b id="cart-total">0</b> som</span></div>
      </div>
      <button id="btn-checkout" class="primary">Buyurtma berish</button>
    </div>
  </main>

  <main id="view-buyurtmalar" class="view">
    <h2>Buyurtmalarim</h2>
    <div id="orders"></div>
    <div id="orders-empty" hidden></div>
  </main>

  <main id="view-chat" class="view">
    <h2>Yordamchi</h2>
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input">
      <input id="chat-text" type="text" placeholder="Savolingizni yozing..." />
      <button id="btn-send" class="primary">➤</button>
    </div>
  </main>

  <main id="view-sodiqlik" class="view">
    <h2>Sodiqlik</h2>
    <div id="loyalty"></div>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="katalog">🛍<span>Katalog</span></button>
    <button class="tab" data-view="savat">🛒<span>Savat</span><b id="cart-badge" hidden>0</b></button>
    <button class="tab" data-view="buyurtmalar">📦<span>Buyurtma</span></button>
    <button class="tab" data-view="chat">💬<span>Chat</span></button>
    <button class="tab" data-view="sodiqlik">🎁<span>Sodiqlik</span></button>
  </nav>

  <!-- Balans to'ldirish oynasi (task_3) — balans yetmasa shu yerда ochiladi -->
  <div id="topup-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button id="topup-close" class="modal-close" aria-label="Yopish">✕</button>
      <h3>🪙 Balansni to'ldirish</h3>
      <p id="topup-msg" class="topup-msg"></p>

      <label class="topup-label">To'ldirish summasi (som):</label>
      <input id="topup-amount" type="number" min="1" inputmode="numeric" />

      <label class="topup-label">To'lov usulini tanlang:</label>
      <div id="topup-methods" class="topup-methods"></div>
      <div id="topup-detail" class="topup-detail" hidden></div>

      <label class="topup-label">To'lov chekini yuklang:</label>
      <input id="topup-file" type="file" accept="image/*" />

      <button id="topup-submit" class="primary" style="margin-top:12px">
        Yuborish
      </button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
