# Render.com uchun sozlama (Blueprint).
# Bu backend web-xizmatini yaratadi: u ham API (/api/...), ham Mini App (/app)
# ni xizmat qiladi. Maxfiy qiymatlar (tokenlar) Render saytida qo'lда kiritiladi.
services:
  - type: web
    name: arzon-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      # DATABASE_URL — Neon ulanish satri. sync:false => Blueprint uni
      # QAYTA YOZMAYDI (siz Render saytida kiritган Neon qiymati saqlanadi).
      # DIQQAT: bu qiymat bo'sh bo'lса kod SQLite'ga tushadi va ma'lumot
      # saqlanmaydi — shuning uchun uni albatta Neon satriga o'rnating.
      - key: DATABASE_URL
        sync: false
      # Quyidagilarni Render saytida qo'lда kiritasiz (Environment bo'limi):
      #   MINIAPP_BOT_TOKEN   = Savdo bot tokeni (initData tekshiruvi uchun)
      #   INTERNAL_API_TOKEN  = botlar bilan bir xil maxfiy token
      #   SUPER_ADMIN_IDS     = sizning Telegram ID
      - key: MINIAPP_BOT_TOKEN
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: SUPER_ADMIN_IDS
        sync: false
      # Webhook rejimi: botlar backend ichida ishlaydi (PowerShell kerak emas).
      #   SAVDO_BOT_TOKEN     = mijoz boti tokeni (MINIAPP_BOT_TOKEN bilan bir xil)
      #   BOSHQARUV_BOT_TOKEN = admin boti tokeni
      - key: SAVDO_BOT_TOKEN
        sync: false
      - key: BOSHQARUV_BOT_TOKEN
        sync: false
      # Majburiy kanalga obuna (ixtiyoriy — bo'sh bo'lса o'chiq).
      # Bot kanalда ADMIN bo'lishi kerak. ID: @username yoki -100...
      - key: NEWS_CHANNEL_ID
        sync: false
      - key: NEWS_CHANNEL_LINK
        sync: false
